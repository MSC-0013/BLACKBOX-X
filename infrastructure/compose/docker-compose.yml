name: blackbox-x

networks:
  blackbox-net:
    driver: bridge

volumes:
  blackbox_mysql_data:
  blackbox_redis_data:
  blackbox_kafka_data:
  blackbox_minio_data:

services:
  # ===========================================================================
  # MySQL 8.4.12 LTS
  # Profiles: foundation, data, full
  # Host port mapped to 3308 to avoid conflicts with host native (3306) & MirrorGrid (3307)
  # ===========================================================================
  mysql:
    image: mysql:8.4
    container_name: blackbox-mysql
    profiles:
      - foundation
      - data
      - full
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blackbox}
      MYSQL_USER: ${MYSQL_USER:-blackbox}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blackbox}
    ports:
      - "3308:3306"
    volumes:
      - blackbox_mysql_data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - blackbox-net

  # ===========================================================================
  # Redis 8.10.1 / 7.4-alpine
  # Profiles: foundation, data, full
  # Host port mapped to 6380 to avoid collision with host native Redis (6379)
  # ===========================================================================
  redis:
    image: redis:7.4-alpine
    container_name: blackbox-redis
    profiles:
      - foundation
      - data
      - full
    ports:
      - "6380:6379"
    volumes:
      - blackbox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - blackbox-net

  # ===========================================================================
  # Kafka 4.3.1 KRaft Single Broker
  # Profiles: foundation, events, full
  # ===========================================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: blackbox-kafka
    profiles:
      - foundation
      - events
      - full
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: '4L622nShTUiBenVKBpahFQ'
    volumes:
      - blackbox_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - blackbox-net

  # ===========================================================================
  # MinIO Object Storage
  # Profiles: foundation, storage, full
  # ===========================================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: blackbox-minio
    profiles:
      - foundation
      - storage
      - full
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - blackbox_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - blackbox-net

  # ===========================================================================
  # HA Events (3-broker KRaft for M5+/M10 resilience testing)
  # Profile: events-ha
  # ===========================================================================
  kafka-ha-1:
    image: apache/kafka:4.3.1
    container_name: blackbox-kafka-ha-1
    profiles:
      - events-ha
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-ha-1:29092,PLAINTEXT_HOST://localhost:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-ha-1:29093,2@kafka-ha-2:29093,3@kafka-ha-3:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      CLUSTER_ID: '4L622nShTUiBenVKBpahFQ'
    ports:
      - "19092:19092"
    networks:
      - blackbox-net

  kafka-ha-2:
    image: apache/kafka:4.3.1
    container_name: blackbox-kafka-ha-2
    profiles:
      - events-ha
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-ha-2:29092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-ha-1:29093,2@kafka-ha-2:29093,3@kafka-ha-3:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      CLUSTER_ID: '4L622nShTUiBenVKBpahFQ'
    ports:
      - "29092:29092"
    networks:
      - blackbox-net

  kafka-ha-3:
    image: apache/kafka:4.3.1
    container_name: blackbox-kafka-ha-3
    profiles:
      - events-ha
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:39092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-ha-3:29092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-ha-1:29093,2@kafka-ha-2:29093,3@kafka-ha-3:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      CLUSTER_ID: '4L622nShTUiBenVKBpahFQ'
    ports:
      - "39092:39092"
    networks:
      - blackbox-net

  # ===========================================================================
  # Observability Stack
  # Profile: observability
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: blackbox-otel-collector
    profiles:
      - observability
      - full
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - blackbox-net

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: blackbox-prometheus
    profiles:
      - observability
      - full
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - blackbox-net
